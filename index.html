    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath();
    ctx.ellipse(clampedX, roadY + r * 0.5, r * 0.7, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();

    // Dot
    const grad = ctx.createRadialGradient(clampedX - r * 0.2, roadY - r * 0.2, r * 0.1, clampedX, roadY, r);
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, '#4a6fa5'); grad.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = grad; ctx.beginPath();
    ctx.arc(clampedX, roadY, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    ctx.stroke();

    // Phase label
    ctx.fillStyle = isDark ? '#cdcfd3' : '#1e1e1e'; ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText(`阶段: ${snap.segInfo.seg.label}`, clampedX, roadY - 34);
    ctx.fillText(`v=${snap.segInfo.v.toFixed(1)} m/s`, clampedX, roadY + 42);

    // Distance markers
    ctx.fillText(`0`, roadL - 10, roadY + 25);
    ctx.fillText(`${snap.totalDist.toFixed(0)}m`, roadR + 10, roadY + 25);
    ctx.fillText(`${snap.segInfo.s.toFixed(1)}m`, clampedX, roadY - 50);

    // Title
    ctx.fillStyle = isDark ? '#cdcfd3' : '#1e1e1e'; ctx.font = 'bold 17px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(p.title, 20, 28);

    // Mini graphs (s-t and v-t)
    this._drawMiniVT(p, snap);
    this._drawMiniST3(p, snap);
  }

  _drawMiniVT(p, snap) {
    const ctx = this.ctx;
    const isDark = document.body.classList.contains('dark');
    const mx = 555, my = 18, mw = 228, mh = 135;
    ctx.fillStyle = isDark ? 'rgba(30,32,38,0.92)' : 'rgba(255,255,252,0.92)';
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    this._roundRect(mx, my, mw, mh, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = isDark ? '#bbb' : '#333'; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('v-t 图', mx + mw/2, my + 16);

    const gx = mx + 30, gy = my + 28, gw = mw - 40, gh = mh - 42;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy+gh); ctx.lineTo(gx+gw, gy+gh); ctx.stroke();

    const maxV = Math.max(...snap.vtPoints.map(p => p.v), 1) * 1.2;
    ctx.strokeStyle = '#b5583d'; ctx.lineWidth = 2;
    ctx.beginPath();
    snap.vtPoints.forEach((pt, i) => {
      const sx = gx + (pt.t / snap.totalTime) * gw;
      const sy = gy + gh - (pt.v / maxV) * gh;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.stroke();

    const curTX = gx + (Math.min(snap.segInfo.segStart + snap.segInfo.localT, snap.totalTime) / snap.totalTime) * gw;
    ctx.strokeStyle = isDark ? '#5b9ecf' : '#1e4a6b'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(curTX, gy); ctx.lineTo(curTX, gy+gh); ctx.stroke();
    ctx.setLineDash([]);
  }

  _drawMiniST3(p, snap) {
    const ctx = this.ctx;
    const isDark = document.body.classList.contains('dark');
    const mx = 555, my = 163, mw = 228, mh = 135;
    ctx.fillStyle = isDark ? 'rgba(30,32,38,0.92)' : 'rgba(255,255,252,0.92)';
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    this._roundRect(mx, my, mw, mh, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = isDark ? '#bbb' : '#333'; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('s-t 图', mx + mw/2, my + 16);

    const gx = mx + 30, gy = my + 28, gw = mw - 40, gh = mh - 42;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy+gh); ctx.lineTo(gx+gw, gy+gh); ctx.stroke();

    ctx.strokeStyle = '#3a7d5e'; ctx.lineWidth = 2;
    ctx.beginPath();
    snap.stPoints.forEach((pt, i) => {
      const sx = gx + (pt.t / snap.totalTime) * gw;
      const sy = gy + gh - (pt.s / snap.totalDist) * gh;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.stroke();

    const curTX = gx + (Math.min(snap.segInfo.segStart + snap.segInfo.localT, snap.totalTime) / snap.totalTime) * gw;
    ctx.strokeStyle = isDark ? '#5b9ecf' : '#1e4a6b'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(curTX, gy); ctx.lineTo(curTX, gy+gh); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ===== TYPE 4: 动点+面积 =====
  _drawType4(p, snap) {
    const ctx = this.ctx;
    // Use user-set ranges if panned/zoomed, otherwise auto-compute
    const xMin = p.xRange ? p.xRange[0] : -0.5;
    const xMax = p.xRange ? p.xRange[1] : snap.tMax + 1;
    const yMin = p.yRange ? p.yRange[0] : -0.5;
    const yMax = p.yRange ? p.yRange[1] : Math.max(snap.maxArea * 1.5, snap.qy * 1.2, 5);
    const gx = 60, gy = 30, gw = this.W - 200, gh = this.H - 80;
    this._drawCoordGrid(gx, gy, gw, gh, [xMin, xMax], [yMin, yMax]);

    // Draw curve
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 100; i++) {
      const wx = xMin + (i/100)*(xMax - xMin);
      let wy;
      try { wy = Function('x', `return ${p.curveFunc};`)(wx); } catch { wy = wx * wx; }
      const cx = gx + (wx - xMin)/(xMax - xMin)*gw;
      const cy = gy + gh - (wy - yMin)/(yMax - yMin)*gh;
      if (first) { ctx.moveTo(cx, clamp(cy, gy-50, gy+gh+50)); first = false; }
      else ctx.lineTo(cx, clamp(cy, gy-50, gy+gh+50));
    }
    ctx.stroke();

    // Curve label
    ctx.fillStyle = '#888'; ctx.font = 'italic 14px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(`y=${p.curveFunc.replace(/\*/g,'')}`, gx + gw - 60, gy + 20);

    // Triangle OPQ fill
    const pCx = gx + (snap.px - xMin)/(xMax - xMin)*gw;
    const pCy = gy + gh; // y=0
    const oCx = gx + (0 - xMin)/(xMax - xMin)*gw;
    const oCy = gy + gh; // y=0
    const qCy = gy + gh - (snap.qy - yMin)/(yMax - yMin)*gh;

    ctx.fillStyle = 'rgba(255,107,107,0.25)'; ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(oCx, oCy); ctx.lineTo(pCx, pCy); ctx.lineTo(pCx, clamp(qCy, gy, gy+gh)); ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Points
    [{x:0,y:0,l:'O',c:'#666'},{x:snap.px,y:0,l:'P',c:'#FF6B6B'},{x:snap.px,y:snap.qy,l:'Q',c:'#4ECDC4'}].forEach(pt => {
      const cx = gx + (pt.x - xMin)/(xMax - xMin)*gw;
      const cy = gy + gh - (pt.y - yMin)/(yMax - yMin)*gh;
      ctx.fillStyle = pt.c; ctx.beginPath(); ctx.arc(cx, clamp(cy, gy, gy+gh), 6, 0, Math.PI*2); ctx.fill();
      ctx.fillText(pt.l, cx + 10, clamp(cy, gy, gy+gh) + 4);
    });

    // Dashed line P→Q
    ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(pCx, pCy); ctx.lineTo(pCx, clamp(qCy, gy, gy+gh)); ctx.stroke();
    ctx.setLineDash([]);

    // Title & data
    ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(p.title, 20, 22);
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText(`S(t) = ${snap.area.toFixed(3)}`, gx + gw + 10, gy + 40);

    // Mini area-time graph
    this._drawMiniAreaGraph(snap, snap.areaTimeData, '面积 S(t)', snap.maxArea, snap.tMax, 570, 280, 210, 140);
  }

  _drawMiniAreaGraph(snap, data, title, maxY, maxX, mx, my, mw, mh) {
    const ctx = this.ctx;
    const isDark = document.body.classList.contains('dark');
    ctx.fillStyle = isDark ? 'rgba(30,32,38,0.92)' : 'rgba(255,255,252,0.92)';
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 1;
    this._roundRect(mx, my, mw, mh, 6); ctx.fill(); ctx.stroke();

    ctx.fillStyle = isDark ? '#bbb' : '#333'; ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText(title, mx + mw/2, my + 16);

    const gx = mx + 30, gy = my + 26, gw = mw - 38, gh = mh - 38;
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy+gh); ctx.lineTo(gx+gw, gy+gh); ctx.stroke();

    const maxA = maxY || 1;
    ctx.strokeStyle = '#c4893a'; ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((pt, i) => {
      const sx = gx + (pt.t / maxX) * gw;
      const sy = gy + gh - (pt.a / maxA) * gh;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.stroke();

    // Current time line
    if (snap.t !== undefined) {
      const curTX = gx + (snap.t / maxX) * gw;
      ctx.strokeStyle = isDark ? '#5b9ecf' : '#1e4a6b'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(curTX, gy); ctx.lineTo(curTX, gy+gh); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ===== TYPE 5: 双动点 =====
  _drawType5(p, snap) {
    const ctx = this.ctx;
    const verts = snap.vertices;
    // Use user-set ranges if panned/zoomed, otherwise auto-compute
    let xMin, xMax, yMin, yMax;
    if (p.xRange) { [xMin, xMax] = p.xRange; [yMin, yMax] = p.yRange; }
    else {
      const allX = [...verts.map(v=>v.x), snap.pPos.x, snap.qPos.x];
      const allY = [...verts.map(v=>v.y), snap.pPos.y, snap.qPos.y];
      const margin = 1.5;
      xMin = Math.min(...allX) - margin; xMax = Math.max(...allX) + margin;
      yMin = Math.min(...allY) - margin; yMax = Math.max(...allY) + margin;
    }

    const gx = 60, gy = 30, gw = this.W - 200, gh = this.H - 80;
    // Grid
    this._drawCoordGrid(gx, gy, gw, gh, [xMin, xMax], [yMin, yMax]);

    // Draw triangle edges
    ctx.strokeStyle = '#5a6c7d'; ctx.lineWidth = 3;
    ctx.beginPath();
    const v0c = this._w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,verts[0].x,verts[0].y);
    ctx.moveTo(v0c.x, v0c.y);
    for (let i = 1; i < verts.length; i++) {
      const vc = this._w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,verts[i].x,verts[i].y);
      ctx.lineTo(vc.x, vc.y);
    }
    ctx.closePath(); ctx.stroke();

    // Label vertices
    verts.forEach(v => {
      const vc = this._w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,v.x,v.y);
      ctx.fillStyle = '#333'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'center';
      ctx.fillText(v.l, vc.x + 14, vc.y - 8);
    });

    // Draw P and Q
    const pC = this._w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,snap.pPos.x,snap.pPos.y);
    const qC = this._w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,snap.qPos.x,snap.qPos.y);

    // P
    ctx.fillStyle = '#FF6B6B'; ctx.beginPath(); ctx.arc(pC.x, pC.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('P', pC.x, pC.y + 4);

    // Q
    ctx.fillStyle = '#4ECDC4'; ctx.beginPath(); ctx.arc(qC.x, qC.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('Q', qC.x, qC.y + 4);

    // PQ line
    ctx.strokeStyle = '#c4893a'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(qC.x, qC.y); ctx.stroke();
    ctx.setLineDash([]);

    // PQ label
    const midX = (pC.x + qC.x)/2, midY = (pC.y + qC.y)/2;
    ctx.fillStyle = '#c4893a'; ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText(`PQ=${snap.pqDist.toFixed(2)}`, midX, midY - 12);

    // Title
    ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(p.title, 20, 22);

    // Mini PQ-time graph
    const pqMax = Math.max(...snap.pqPoints.map(d=>d.d), 1) * 1.1;
    const pqData = snap.pqPoints.map(d => ({t: d.t, a: d.d}));
    this._drawMiniAreaGraph(snap, pqData, 'PQ长度', pqMax, snap.tMax, 570, 280, 210, 140);
  }

  _w2cv(gx,gy,gw,gh,xMin,xMax,yMin,yMax,wx,wy) {
    const cx = gx + (wx - xMin) / (xMax - xMin) * gw;
    const cy = gy + gh - (wy - yMin) / (yMax - yMin) * gh;
    return { x: cx, y: cy };
  }

  // ===== TYPE 6: 平移重叠 =====
  _drawType6(p, snap) {
    const ctx = this.ctx;
    // Scale: fixed rect [0, fw] x [0, fh] centered in canvas
    const scale = Math.min((this.W - 120) / (p.fixed.w + p.moving.size + 4), (this.H - 120) / Math.max(p.fixed.h, p.moving.size));
    const offX = 60, offY = (this.H - Math.max(p.fixed.h, p.moving.size) * scale) / 2 + 20;
    const fwPx = p.fixed.w * scale, fhPx = p.fixed.h * scale;

    // Fixed rectangle
    ctx.fillStyle = 'rgba(102,119,136,0.2)'; ctx.strokeStyle = '#667788'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.rect(offX, offY, fwPx, fhPx); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#667788'; ctx.font = '14px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText(`固定: ${p.fixed.w}×${p.fixed.h}`, offX + fwPx/2, offY - 10);

    // Moving shape
    const mxPx = offX + snap.movX * scale;
    const msPx = snap.movSize * scale;
    const myPx = offY; // aligned at top

    ctx.fillStyle = 'rgba(255,107,107,0.3)'; ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2.5;
    if (snap.movType === 'rect') {
      ctx.beginPath(); ctx.rect(mxPx, myPx, msPx, msPx); ctx.fill(); ctx.stroke();
    } else {
      // Right isosceles triangle
      ctx.beginPath(); ctx.moveTo(mxPx, myPx); ctx.lineTo(mxPx + msPx, myPx); ctx.lineTo(mxPx, myPx + msPx); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }

    // Overlap highlight
    if (snap.overlapArea > 0.01) {
      const oxPx = Math.max(offX, mxPx);
      const oyPx = offY;
      let owPx, ohPx;
      if (snap.movType === 'rect') {
        owPx = Math.max(0, Math.min(mxPx + msPx, offX + fwPx) - oxPx);
        ohPx = Math.max(0, Math.min(myPx + msPx, offY + fhPx) - oyPx);
        ctx.fillStyle = 'rgba(50,212,99,0.35)'; ctx.strokeStyle = '#32d463'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.rect(oxPx, oyPx, owPx, ohPx); ctx.fill(); ctx.stroke();
      } else {
        // Triangle overlap visualization (simplified: highlight region)
        ctx.fillStyle = 'rgba(50,212,99,0.35)'; ctx.strokeStyle = '#32d463'; ctx.lineWidth = 3;
        // Draw overlap as intersection clipping (approximate with a filled shape at intersection)
        ctx.save();
        ctx.beginPath(); ctx.rect(offX, offY, fwPx, fhPx); ctx.clip();
        ctx.beginPath(); ctx.moveTo(mxPx, myPx); ctx.lineTo(mxPx+msPx, myPx); ctx.lineTo(mxPx, myPx+msPx); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    // Title & data
    ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(p.title, 20, 22);
    ctx.font = '14px "Microsoft YaHei"';
    ctx.fillText(`重叠面积: ${snap.overlapArea.toFixed(2)}`, 20, this.H - 12);

    // Mini overlap area graph
    const oaMax = snap.maxArea || 1;
    this._drawMiniAreaGraph(snap, snap.overlapData, '重叠面积 S(t)', oaMax, snap.totalTime, 560, 280, 220, 140);
  }

  // ===== TYPE 7: 自定义通用 =====
  _drawType7(p, snap) {
    const ctx = this.ctx;
    const isDark = document.body.classList.contains('dark');
    const xr = p.xRange, yr = p.yRange;
    const gx = 60, gy = 30, gw = this.W - 200, gh = this.H - 80;

    // Coordinate grid
    this._drawCoordGrid(gx, gy, gw, gh, xr, yr);

    // Draw fixed shapes
    (snap.shapes || []).forEach(s => {
      if (s.type === 'rect') {
        const cx = gx + (s.x - xr[0])/(xr[1]-xr[0])*gw;
        const cy = gy + gh - (s.y + s.h - yr[0])/(yr[1]-yr[0])*gh;
        const cw = s.w/(xr[1]-xr[0])*gw;
        const ch = s.h/(yr[1]-yr[0])*gh;
        ctx.fillStyle = 'rgba(91,141,239,0.1)'; ctx.strokeStyle = s.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.fill(); ctx.stroke();
        // Label
        ctx.fillStyle = s.color; ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.textAlign = 'center';
        ctx.fillText(s.label, cx + cw/2, cy - 8);
        // Diagonal
        ctx.strokeStyle = s.color; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(cx, cy+ch); ctx.lineTo(cx+cw, cy); ctx.stroke();
        ctx.setLineDash([]);
      }
    });

    // Draw fixed points
    (snap.fixPoints || []).forEach(pt => {
      const cx = gx + (pt.x - xr[0])/(xr[1]-xr[0])*gw;
      const cy = gy + gh - (pt.y - yr[0])/(yr[1]-yr[0])*gh;
      ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = pt.color; ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.textAlign = 'center';
      ctx.fillText(pt.label, cx, cy - 10);
    });

    // Draw moving point
    const mpx = gx + (snap.px - xr[0])/(xr[1]-xr[0])*gw;
    const mpy = gy + gh - (snap.py - yr[0])/(yr[1]-yr[0])*gh;
    const r = 8;
    const grad = ctx.createRadialGradient(mpx-1, mpy-1, 1, mpx, mpy, r);
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.4, '#e8836d'); grad.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(mpx, mpy, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8836d'; ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('P', mpx, mpy - 14);
    // PQ dashed to x-axis
    ctx.strokeStyle = '#e8836d'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mpx, mpy); ctx.lineTo(mpx, gy + gh); ctx.stroke();
    ctx.setLineDash([]);
    // Q point on x-axis
    ctx.fillStyle = '#c4893a'; ctx.beginPath(); ctx.arc(mpx, gy+gh, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillText('Q', mpx + 8, gy + gh - 4);

    // Title
    ctx.fillStyle = isDark ? '#cdcfd3' : '#1e1e1e'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText(p.title, 20, 22);

    // Live data
    ctx.font = 'bold 13px "Microsoft YaHei"';
    ctx.fillStyle = isDark ? '#aaa' : '#555';
    ctx.fillText(`P(${snap.px.toFixed(2)},${snap.py.toFixed(2)})  |  ${snap.trackedName}=${snap.trackedVal.toFixed(3)}`, 20, this.H - 14);

    // Mini tracked graph
    this._drawMiniAreaGraph(snap, snap.trackData, `${snap.trackedName}(t)`, snap.maxTrack, snap.tMax, 570, 280, 210, 140);
  }

  /** Draw geometry editor overlay */
  _drawGeoEditor(app) {
    const ctx = this.ctx; const isDark = document.body.classList.contains('dark');
    ctx.fillStyle = isDark ? '#1f2126' : '#f9f8f4'; ctx.fillRect(0, 0, this.W, this.H);
    // Grid
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)'; ctx.lineWidth = 0.5;
    for (let x = 0; x <= this.W; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.H); ctx.stroke(); }
    for (let y = 0; y <= this.H; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.W, y); ctx.stroke(); }
    // Lines
    (app._geoLines||[]).forEach(l => {
      ctx.strokeStyle = '#c4893a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    });
    // Points
    (app._geoPts||[]).forEach((pt, i) => {
      const isMoving = app._geoMoving === pt.label;
      const isPath = app._geoPath.includes(pt.label);
      ctx.fillStyle = isMoving ? '#e8836d' : isPath ? '#c4893a' : '#5b8def';
      ctx.beginPath(); ctx.arc(pt.x, pt.y, isMoving ? 8 : 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px'; ctx.textAlign = 'center';
      ctx.fillText(pt.label, pt.x, pt.y + 3);
      ctx.fillStyle = isDark ? '#ddd' : '#333'; ctx.font = 'bold 14px';
      ctx.fillText(pt.label, pt.x, pt.y - 12);
    });
    // Path arrows
    if (app._geoPath.length >= 2) {
      ctx.strokeStyle = '#e8836d'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
      ctx.beginPath();
      for (let i = 0; i < app._geoPath.length; i++) {
        const p = app._geoPts.find(q => q.label === app._geoPath[i]);
        if (!p) continue;
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Help text
    ctx.fillStyle = isDark ? '#cdcfd3' : '#1e1e1e'; ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.textAlign = 'left';
    ctx.fillText('✏️ 几何编辑器 — 点击画布放置顶点，下方工具栏配置动点和路径', 20, 25);
    ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = isDark ? '#999' : '#666';
    ctx.fillText(`已放置 ${(app._geoPts||[]).length} 个顶点 | 动点: ${app._geoMoving||'未选'} | 路径: ${(app._geoPath||[]).join('→')||'未设置'}`, 20, 45);
  }
}

// ============ APP CONTROLLER ============
class App {
  constructor() {
    this.animState = new AnimState();
    this.renderer = new Renderer();
    this.animId = null;
    this._lastTs = 0;
    this._curProblem = null;
  }

  init() {
    // Theme toggle
    $('themeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      $('themeBtn').textContent = document.body.classList.contains('dark') ? '🌙' : '☀️';
      this._redraw();
    });


    // Example buttons
    document.querySelectorAll('.example-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = parseInt(btn.dataset.example);
        $('problemInput').value = EXAMPLES[type] || '';
        this.loadProblem(EXAMPLES[type] || '', true);
      });
    });

    // Parse button
    $('btnParse').addEventListener('click', () => {
      const text = $('problemInput').value.trim();
      if (!text) { this._showStatus('请先输入或选择示例题目', 'warn'); return; }
      this.loadProblem(text, false);
    });

    // Play/Pause/Reset
    $('btnPlay').addEventListener('click', () => this.play());
    $('btnPause').addEventListener('click', () => this.pause());
    $('btnReset').addEventListener('click', () => this.reset());

    // Slider
    $('timeSlider').addEventListener('input', () => {
      this.pause();
      const val = parseFloat($('timeSlider').value);
      const total = this.animState.getTotalRange();
      const frac = val / 100;
      this.animState.setCurrentValue(frac * total);
      this._updateAll();
    });

    // Speed
    $('speedSelect').addEventListener('change', () => {
      this.animState.speed = parseFloat($('speedSelect').value);
    });

    // Manual config toggle
    $('manualToggle').addEventListener('click', () => {
      $('manualToggle').classList.toggle('open');
      $('manualPanel').classList.toggle('show');
    });

    // Manual config type switcher
    $('cfgType').addEventListener('change', () => {
      this._updateConfigPanel();
    });

    // Apply manual config
    $('btnApply').addEventListener('click', () => {
      const problem = this._readManualConfig();
      if (problem) {
        this._curProblem = problem;
        this.animState.load(problem);
        this.pause();
        this.reset();
        this._updateConfigPanelFromProblem(problem);
        $('statusBar').className = 'status-bar show success';
        $('statusBar').innerHTML = '✅ 手动配置已应用';
        this._updateAll();
      }
    });

    // ---- Canvas drag-to-pan & scroll-to-zoom (coordinate types 2,4,5) ----
    this._dragInfo = null;
    this._pinchInfo = null; // { dist, midX, midY, xr, yr } for two-finger pinch

    /** Convert clientX/Y to canvas logical coords */
    const _client2canvas = (cx, cy) => {
      const rect = canvas.getBoundingClientRect();
      return {
        mx: (cx - rect.left) * (CW / rect.width),
        my: (cy - rect.top) * (CH / rect.height)
      };
    };

    /** Get world coord at canvas point (mx, my) using grid g */
    const _canvas2world = (mx, my, g) => ({
      wx: g.xr[0] + (mx - g.gx) / g.gw * (g.xr[1] - g.xr[0]),
      wy: g.yr[0] + (g.gy + g.gh - my) / g.gh * (g.yr[1] - g.yr[0])
    });

    /** Get world coord at midpoint between two touches */
    const _touchMidWorld = (t0, t1, g) => {
      const rect = canvas.getBoundingClientRect();
      const midCX = ((t0.clientX + t1.clientX) / 2 - rect.left) * (CW / rect.width);
      const midCY = ((t0.clientY + t1.clientY) / 2 - rect.top) * (CH / rect.height);
      return _canvas2world(midCX, midCY, g);
    };

    // ---- Mouse ----
    canvas.addEventListener('mousedown', (e) => {
      const p = this._curProblem; if (!p || ![2,4,5].includes(p.type)) return;
      if (!p._defaultXRange) { p._defaultXRange = [...(p.xRange||[0,10])]; p._defaultYRange = [...(p.yRange||[0,10])]; }
      const { mx, my } = _client2canvas(e.clientX, e.clientY);
      this._dragInfo = { sx: mx, sy: my, xr: [...(p.xRange||[0,10])], yr: [...(p.yRange||[0,10])] };
      canvas.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!this._dragInfo) return;
      const p = this._curProblem; if (!p) return;
      const { mx, my } = _client2canvas(e.clientX, e.clientY);
      const g = this._gridLayout(); if (!g) return;
      const dxWorld = -(mx - this._dragInfo.sx) / g.pxPerUnit;
      const dyWorld = (my - this._dragInfo.sy) / g.pxPerUnit;
      p.xRange = [this._dragInfo.xr[0] + dxWorld, this._dragInfo.xr[1] + dxWorld];
      p.yRange = [this._dragInfo.yr[0] + dyWorld, this._dragInfo.yr[1] + dyWorld];
      this._updateAll();
    });
    window.addEventListener('mouseup', () => {
      if (this._dragInfo) { this._dragInfo = null; canvas.style.cursor = ''; }
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = this._curProblem; if (!p || ![2,4,5].includes(p.type)) return;
      const g = this._gridLayout(); if (!g) return;
      const { mx, my } = _client2canvas(e.clientX, e.clientY);
      const { wx, wy } = _canvas2world(mx, my, g);
      // Smooth zoom factor — 8% per wheel tick feels natural
      const zoom = e.deltaY > 0 ? 1.08 : 1 / 1.08;
      p.xRange = [wx - (wx - g.xr[0]) * zoom, wx + (g.xr[1] - wx) * zoom];
      p.yRange = [wy - (wy - g.yr[0]) * zoom, wy + (g.yr[1] - wy) * zoom];
      if (!p._defaultXRange) { p._defaultXRange = [...g.xr]; p._defaultYRange = [...g.yr]; }
      this._updateAll();
      this._dragInfo = null;
    }, { passive: false });

    // ---- Touch (mobile) ----
    canvas.addEventListener('touchstart', (e) => {
      const p = this._curProblem; if (!p || ![2,4,5].includes(p.type)) return;
      if (e.touches.length === 1) {
        const { mx, my } = _client2canvas(e.touches[0].clientX, e.touches[0].clientY);
        this._dragInfo = { sx: mx, sy: my, xr: [...(p.xRange||[0,10])], yr: [...(p.yRange||[0,10])] };
        this._pinchInfo = null;
      } else if (e.touches.length === 2) {
        this._dragInfo = null;
        const g = this._gridLayout(); if (!g) return;
        const t0 = e.touches[0], t1 = e.touches[1];
        const dist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        const { wx, wy } = _touchMidWorld(t0, t1, g);
        this._pinchInfo = { dist, wx, wy, xr: [...(p.xRange||[0,10])], yr: [...(p.yRange||[0,10])] };
        if (!p._defaultXRange) { p._defaultXRange = [...(p.xRange||[0,10])]; p._defaultYRange = [...(p.yRange||[0,10])]; }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const p = this._curProblem; if (!p) return;
      if (e.touches.length === 1 && this._dragInfo) {
        const { mx, my } = _client2canvas(e.touches[0].clientX, e.touches[0].clientY);
        const g = this._gridLayout(); if (!g) return;
        const dxW = -(mx - this._dragInfo.sx) / g.pxPerUnit;
        const dyW = (my - this._dragInfo.sy) / g.pxPerUnit;
        p.xRange = [this._dragInfo.xr[0] + dxW, this._dragInfo.xr[1] + dxW];
        p.yRange = [this._dragInfo.yr[0] + dyW, this._dragInfo.yr[1] + dyW];
        this._updateAll();
      } else if (e.touches.length === 2 && this._pinchInfo) {
        const t0 = e.touches[0], t1 = e.touches[1];
        const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        if (d < 10) return;
        // Smoother pinch: use sqrt to dampen aggressive scaling
        let factor = this._pinchInfo.dist / d;
        factor = factor > 2 ? 2 : factor < 0.5 ? 0.5 : factor; // clamp
        // Zoom around the ORIGINAL pinch midpoint (stable)
        const wx = this._pinchInfo.wx, wy = this._pinchInfo.wy;
        const hw = (this._pinchInfo.xr[1] - this._pinchInfo.xr[0]) / 2 * factor;
        const hh = (this._pinchInfo.yr[1] - this._pinchInfo.yr[0]) / 2 * factor;
        p.xRange = [wx - hw, wx + hw];
        p.yRange = [wy - hh, wy + hh];
        this._updateAll();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) { this._dragInfo = null; this._pinchInfo = null; }
      else if (e.touches.length === 1 && this._pinchInfo) {
        // Transition from pinch to single-finger drag
        this._pinchInfo = null;
        const p = this._curProblem; if (!p) return;
        const { mx, my } = _client2canvas(e.touches[0].clientX, e.touches[0].clientY);
        this._dragInfo = { sx: mx, sy: my, xr: [...(p.xRange||[0,10])], yr: [...(p.yRange||[0,10])] };
      }
    });


    // ---- Geometry Editor (for Type 7) ----
    this._geoPts = [];        // {x, y, label}
    this._geoLines = [];      // {x1,y1,x2,y2}
    this._geoMoving = '';     // label of moving point
    this._geoPath = [];       // labels of path vertices in order
    this._geoRecording = false; // recording path clicks

    $('geoEditor').style.display = 'none'; // hidden by default, shown when Type 7 selected

    // Show geo editor when Type 7 is selected in manual config
    $('cfgType').addEventListener('change', () => {
      $('geoEditor').style.display = $('cfgType').value === '7' ? 'block' : 'none';
    });

    const updateGeoDropdowns = () => {
      const sel = $('geoMoving');
      const labels = this._geoPts.map(p => p.label);
      sel.innerHTML = '<option value="">选择动点…</option>' + labels.map(l => `<option value="${l}" ${this._geoMoving===l?'selected':''}>${l}</option>`).join('');
      $('geoPathShow').textContent = this._geoPath.length ? '→'.repeat(0) + this._geoPath.join('→') : '未设置';
    };

    const drawGeo = () => {
      // Draw current geometry state on canvas (called from _updateAll when active)
    };

    // Canvas click handler for geo editor
    canvas.addEventListener('click', (e) => {
      if ($('geoEditor').style.display !== 'block') return;
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (CW / rect.width);
      const cy = (e.clientY - rect.top) * (CH / rect.height);

      if (document.activeElement === $('geoAddPt') || this._geoRecording) {
        // Add point
        const label = $('geoLabel').value.trim() || String.fromCharCode(65 + this._geoPts.length);
        this._geoPts.push({ x: cx, y: cy, label });
        // Auto-advance label
        const next = String.fromCharCode(label.charCodeAt(0) + 1);
        $('geoLabel').value = next;
        updateGeoDropdowns();
        this._updateAll();
      }
    });

    // Button handlers
    $('geoAddPt').addEventListener('click', () => { document.activeElement?.blur(); });
    $('geoRect').addEventListener('click', () => {
      if (this._geoPts.length >= 4) {
        const pts = this._geoPts.slice(-4);
        // Connect: 0-1, 1-2, 2-3, 3-0 to form rectangle, and diagonal for first/last
        this._geoLines = [
          { x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y },
          { x1: pts[1].x, y1: pts[1].y, x2: pts[2].x, y2: pts[2].y },
          { x1: pts[2].x, y1: pts[2].y, x2: pts[3].x, y2: pts[3].y },
          { x1: pts[3].x, y1: pts[3].y, x2: pts[0].x, y2: pts[0].y },
        ];
        // Add diagonal (pts[0] to pts[2], typically D to B)
        this._geoLines.push({ x1: pts[0].x, y1: pts[0].y, x2: pts[2].x, y2: pts[2].y });
      }
      this._updateAll();
    });
    $('geoLineJoin').addEventListener('click', () => {
      if (this._geoPts.length >= 2) {
        const pts = this._geoPts.slice(-2);
        this._geoLines.push({ x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y });
      }
      this._updateAll();
    });
    $('geoUndo').addEventListener('click', () => {
      if (this._geoPts.length) { this._geoPts.pop(); updateGeoDropdowns(); this._updateAll(); }
    });
    $('geoClear').addEventListener('click', () => {
      this._geoPts = []; this._geoLines = []; this._geoMoving = ''; this._geoPath = []; this._geoRecording = false;
      updateGeoDropdowns(); this._updateAll();
    });
    $('geoMoving').addEventListener('change', () => { this._geoMoving = $('geoMoving').value; });
    $('geoPathRec').addEventListener('click', () => {
      if (this._geoRecording) {
        this._geoRecording = false; $('geoPathRec').textContent = '🔴 记录路径';
      } else {
        this._geoPath = []; this._geoRecording = true; $('geoPathRec').textContent = '⏹ 停止记录';
        $('geoPathShow').textContent = '点击顶点...';
      }
      this._updateAll();
    });
    $('geoPathClear').addEventListener('click', () => { this._geoPath = []; updateGeoDropdowns(); this._updateAll(); });

    $('geoApply').addEventListener('click', () => {
      if (this._geoPts.length < 2) return;
      const pts = this._geoPts;
      // Auto-detect shape: 4+ points → rectangle
      let shapes = [];
      let fixPoints = pts.map(p => ({ ...p, color: (this._geoMoving === p.label ? '#e8836d' : '#5bb98c') }));
      if (pts.length >= 4) {
        const xs = pts.slice(0,4).map(p=>p.x), ys = pts.slice(0,4).map(p=>p.y);
        const x=Math.min(...xs), y=Math.min(...ys), w=Math.max(...xs)-x, h=Math.max(...ys)-y;
        shapes = [{ type:'rect', x, y, w:Math.max(w,1), h:Math.max(h,1), color:'#5b8def', label:pts.slice(0,4).map(p=>p.label).join('') }];
      }
      // Build path segments
      let pathSegs = [];
      if (this._geoPath.length >= 2) {
        let tAcc = 0;
        for (let i=0; i<this._geoPath.length-1; i++) {
          const from = pts.find(p=>p.label===this._geoPath[i]), to = pts.find(p=>p.label===this._geoPath[i+1]);
          const len = (from&&to)?Math.hypot(to.x-from.x,to.y-from.y):5;
          tAcc += len;
          pathSegs.push({ tEnd: Math.round(tAcc*10)/10 });
        }
      } else {
        pathSegs = [{ tEnd: 5 }, { tEnd: 8 }];
      }

      const problem = {
        type:7, title:'自定义几何动点', confidence:'manual',
        xRange:[-1, Math.max(...pts.map(p=>p.x))+3], yRange:[-3, Math.max(...pts.map(p=>p.y))+3],
        tMax: pathSegs.length?pathSegs[pathSegs.length-1].tEnd:10, paramName:'t',
        shapes, fixPoints, pathSegs,
        trackedExpr: $('geoTrack').value||'py-px', trackedName: $('geoTrackName').value||'y',
        unitDist:'', unitTime:'s'
      };

      this._curProblem = problem; this.animState.load(problem);
      this.pause(); this.reset();
      $('geoEditor').style.display = 'none';
      $('statusBar').className = 'status-bar show success';
      $('statusBar').innerHTML = '✅ 几何动画已生成';
      this._updateAll();
    });

    // ---- End geometry editor ----

    // Auto-detect type as user types (debounced)
    let detectTimer = null;
    $('problemInput').addEventListener('input', () => {
      clearTimeout(detectTimer);
      detectTimer = setTimeout(() => {
        const text = $('problemInput').value.trim();
        if (text.length < 5) { $('statusBar').className = 'status-bar'; return; }
        const { type, confidence } = Parser.detectType(text);
        const names = {1:'🏃 追及相遇',2:'📐 函数动态',3:'📈 分段运动',4:'📊 动点面积',5:'🔺 双动点几何',6:'⬜ 平移重叠',7:'🔧 自定义'};
        const confLabel = confidence==='high'?'✓':'?';
        $('statusBar').className = 'status-bar show ' + (confidence==='high'?'success':confidence==='medium'?'warn':'error');
        $('statusBar').innerHTML = `🔍 检测到：<b>${names[type]||'未知'}</b> ${confLabel} — 点击「解析并生成动画」确认`;
      }, 600);
    });

    // Initial draw
    this._redraw();
  }

  /** Compute grid layout for coordinate types (used by pan/zoom) */
  _gridLayout() {
    const p = this._curProblem;
    if (!p || ![2,4,5,7].includes(p.type)) return null;
    let gx = 60, gy = 30, gw = CW - 130, gh = CH - 100;
    if (p.type === 4 || p.type === 5) { gx = 60; gy = 30; gw = CW - 200; gh = CH - 80; }

    // Get or auto-create ranges
    if (!p.xRange) {
      const snap = this.animState.getSnapshot();
      if (!snap) return null;
      if (p.type === 4) {
        p.xRange = [-0.5, snap.tMax + 1];
        p.yRange = [-0.5, Math.max(snap.maxArea * 1.5, (snap.qy||0) * 1.2, 5)];
      } else if (p.type === 5) {
        const vs = snap.vertices; const m = 1.5;
        p.xRange = [Math.min(...vs.map(v=>v.x),snap.pPos.x,snap.qPos.x)-m, Math.max(...vs.map(v=>v.x),snap.pPos.x,snap.qPos.x)+m];
        p.yRange = [Math.min(...vs.map(v=>v.y),snap.pPos.y,snap.qPos.y)-m, Math.max(...vs.map(v=>v.y),snap.pPos.y,snap.qPos.y)+m];
      }
    }
    const xr = [...p.xRange], yr = [...p.yRange];

    // For type 2: enforce isometric yr
    if (p.type === 2) {
      const ppu = gw / (xr[1] - xr[0]);
      let yMinV=Infinity, yMaxV=-Infinity;
      const curves = p.curves || [];
      for (let i=0; i<=40; i++) {
        const sx = xr[0]+(i/40)*(xr[1]-xr[0]);
        curves.forEach(c => { const y = evalExpr(c.expr, {x:sx}); if (isFinite(y)) { yMinV=Math.min(yMinV,y); yMaxV=Math.max(yMaxV,y); } });
      }
      const yMid = (yMinV+yMaxV)/2, wYSpan = gh / ppu;
      yr[0] = yMid - wYSpan/2; yr[1] = yMid + wYSpan/2;
    }
    const pxPerUnit = gw / (xr[1] - xr[0]);
    return { gx, gy, gw, gh, xr, yr, pxPerUnit };
  }

  /** Smooth zoom in/out/reset for coordinate views */
  _zoom(factor) {
    const p = this._curProblem;
    if (!p || ![2,4,5].includes(p.type)) return;
    const g = this._gridLayout();
    if (!g || !g.xr || !g.yr) return;

    if (factor === 0) {
      // Reset to defaults
      if (p._defaultXRange) { p.xRange = [...p._defaultXRange]; p.yRange = [...p._defaultYRange]; }
    } else {
      if (!p._defaultXRange) { p._defaultXRange = [...g.xr]; p._defaultYRange = [...g.yr]; }
      const cx = (g.xr[0] + g.xr[1]) / 2, cy = (g.yr[0] + g.yr[1]) / 2;
      const hw = (g.xr[1] - g.xr[0]) / 2 * factor, hh = (g.yr[1] - g.yr[0]) / 2 * factor;
      p.xRange = [cx - hw, cx + hw]; p.yRange = [cy - hh, cy + hh];
    }
    this._updateAll();
  }

  loadProblem(text, isExample) {
    const result = Parser.parse(text);
    this._curProblem = result;

    $('statusBar').className = 'status-bar show';
    if (result.confidence === 'high') {
      $('statusBar').className += ' success';
      $('statusBar').innerHTML = `✅ 已识别为【类型${result.type}·${result.title}】`;
    } else if (result.confidence === 'medium') {
      $('statusBar').className += ' warn';
      $('statusBar').innerHTML = `⚠️ 已按【类型${result.type}·${result.title}】解析，如有误请展开手动配置调整`;
    } else {
      $('statusBar').className += ' error';
      $('statusBar').innerHTML = `❌ 无法完全识别，已使用默认参数。建议展开下方"手动配置"调整`;
    }

    this.animState.load(result);
    this.pause();
    this.reset();
    this._updateConfigPanelFromProblem(result);
    this._updateAll();
  }

  play() {
    if (!this._curProblem) return;
    this.animState.playing = true;
    this._lastTs = 0;
    if (!this.animId) this._loop(0);
  }

  pause() {
    this.animState.playing = false;
    this._lastTs = 0;
  }

  reset() {
    this.pause();
    this.animState.t = 0;
    if (this._curProblem?.type === 2) {
      const r = this._curProblem.paramRange;
      const mid = (isFinite(r.min) && isFinite(r.max)) ? (r.min + r.max) / 2
        : isFinite(r.min) ? r.min + 2 : isFinite(r.max) ? r.max - 2 : 0;
      this.animState.param = mid;
    }
    this._updateAll();
  }

  _loop(ts) {
    if (this.animState.playing) {
      if (this._lastTs > 0) {
        let dt = (ts - this._lastTs) / 1000 * this.animState.speed;
        dt = Math.min(dt, 0.1); // cap to prevent jumps

        const total = this.animState.getTotalRange();
        const cur = this.animState.getCurrentValue();
        let next = cur + dt;

        if (this._curProblem?.type === 2) {
          const r = this._curProblem.paramRange;
          const span = r.max - r.min;
          if (span > 0.001) {
            next = r.min + ((next - r.min) % span);
          }
          this.animState.param = next;
        } else {
          // Types 1,3,4,5,6: advance time, stop at end
          if (next >= total) {
            next = total;
            this.animState.t = next;
            this.animState.playing = false;
          } else {
            this.animState.t = next;
          }
        }
      }
      this._lastTs = ts;
    }

    this._updateAll();

    if (this.animState.playing) {
      this.animId = requestAnimationFrame((t) => this._loop(t));
    } else {
      this.animId = null;
    }
  }

  _updateAll() {
    const p = this._curProblem;
    const snap = this.animState.getSnapshot();

    // Slider
    const total = this.animState.getTotalRange();
    const cur = this.animState.getCurrentValue();
    $('timeSlider').value = total > 0 ? (cur / total * 100) : 0;

    // Param label
    if (p?.type === 2) {
      const pn = p.paramName || 'm';
      const inRange = snap && snap.inRange;
      const cls = inRange ? 'status-ok' : 'status-bad';
      const icon = inRange ? '✅' : '❌';
      const smin = snap?.pMin ?? p.paramRange.min, smax = snap?.pMax ?? p.paramRange.max;
      let rd;
      if (p.relType === 'above') rd = `${pn} > ${smin.toFixed(3)}`;
      else if (p.relType === 'below') rd = `${pn} < ${smax.toFixed(3)}`;
      else rd = `${smin.toFixed(3)} < ${pn} < ${smax.toFixed(3)}`;
      $('paramLabel').innerHTML = `📐 ${pn} = <span id="paramValue">${cur.toFixed(3)}</span>  |  ${rd}  <span class="${cls}">${icon}</span>`;
    } else {
      $('paramLabel').innerHTML = `⏱ 当前时间：<span id="paramValue">${cur.toFixed(1)}</span> 秒`;
    }

    // Live data
   $('liveData').textContent = this._getLiveText(p, snap);

    // Draw
    if ($('geoEditor').style.display === 'block') {
      this.renderer._drawGeoEditor(this);
    } else {
      this.renderer.draw(p, snap);
    }
  }

  _getLiveText(p, snap) {
    if (!p || !snap) return '等待输入题目…';
    switch (p.type) {
      case 1: {
        const o1 = snap.objects[0], o2 = snap.objects[1];
        return `${o1.name}位置: ${o1.pos.toFixed(1)}${p.unitDist}  |  ${o2.name}位置: ${o2.pos.toFixed(1)}${p.unitDist}  |  剩余距离: ${snap.remaining.toFixed(1)}${p.unitDist}  |  相遇时间: ${snap.meetingTime.toFixed(2)}${p.unitTime}`;
      }
      case 2: {
        const pn = p.paramName || 'm';
        let rangeStr;
        if (p.relType === 'above') rangeStr = `${pn} > ${snap.pMin.toFixed(3)}`;
        else if (p.relType === 'below') rangeStr = `${pn} < ${snap.pMax.toFixed(3)}`;
        else rangeStr = `${snap.pMin.toFixed(3)} < ${pn} < ${snap.pMax.toFixed(3)}`;
        return `${pn} = ${snap.paramVal.toFixed(3)}  |  ${rangeStr}  |  状态: ${snap.inRange ? '✅合规' : '❌超界'}  |  验证: ${snap.satisfied}/${snap.total}`;
      }
      case 3:
        return `阶段: ${snap.segInfo.seg.label}  |  速度: ${snap.segInfo.v.toFixed(1)} ${p.unitDist}/${p.unitTime}  |  位移: ${snap.segInfo.s.toFixed(1)} ${p.unitDist}  |  进度: ${(Math.min(snap.segInfo.s / snap.totalDist * 100, 100)).toFixed(0)}%`;
      case 4:
        return `P(${snap.px.toFixed(2)}, 0)  |  Q(${snap.qx.toFixed(2)}, ${snap.qy.toFixed(2)})  |  △OPQ面积: ${snap.area.toFixed(3)}`;
      case 5:
        return `P位置: (${snap.pPos.x.toFixed(2)}, ${snap.pPos.y.toFixed(2)})  |  Q位置: (${snap.qPos.x.toFixed(2)}, ${snap.qPos.y.toFixed(2)})  |  PQ距离: ${snap.pqDist.toFixed(3)} ${p.unitDist}`;
      case 6:
        return `移动图形位置: x=${snap.movX.toFixed(1)}  |  重叠面积: ${snap.overlapArea.toFixed(2)}  |  最大重叠: ${snap.maxArea.toFixed(2)}`;
      case 7:
        return `P(${snap.px.toFixed(2)}, ${snap.py.toFixed(2)})  |  ${snap.trackedName}=${snap.trackedVal.toFixed(3)}  |  路径段: ${snap.curSeg+1}/${(p.pathSegs||[]).length}`;
      default: return '';
    }
  }

  _redraw() {
    this.renderer.draw(this._curProblem, this.animState.getSnapshot());
  }

  _showStatus(msg, level) {
    $('statusBar').className = `status-bar show ${level}`;
    $('statusBar').innerHTML = msg;
  }

  _updateConfigPanel() {
    const type = parseInt($('cfgType').value);
    document.querySelectorAll('.config-type').forEach(el => el.style.display = 'none');
    const target = document.getElementById(`cfgType${type}`);
    if (target) target.style.display = 'block';
  }

  _updateConfigPanelFromProblem(p) {
    if (!p) return;
    $('cfgType').value = p.type;
    this._updateConfigPanel();

    if (p.type === 1) {
      $('c1_dist').value = p.distance;
      $('c1_v1').value = p.objects[0].speed;
      $('c1_v2').value = p.objects[1].speed;
      $('c1_dir1').value = p.objects[0].direction;
      $('c1_dir2').value = p.objects[1].direction;
      $('c1_delay1').value = p.objects[0].delay || 0;
      $('c1_delay2').value = p.objects[1].delay || 0;
    } else if (p.type === 2) {
      $('c2_curves').value = (p.curves || []).map(c => c.expr).join('\n');
      $('c2_pn').value = p.paramName || 'm';
      $('c2_de').value = p.dynExpr || (p.paramName + '*x');
      $('c2_rel').value = p.relType || 'between';
      $('c2_op').value = p.condition.op;
      $('c2_cval').value = p.condition.value;
    } else if (p.type === 3) {
      $('c3_segs').value = p.segments.map(s => `${s.duration},${s.v0},${s.a},${s.label}`).join('\n');
    } else if (p.type === 4) {
      $('c4_speed').value = p.speed;
      $('c4_func').value = p.curveFunc;
      $('c4_tmax').value = p.tMax;
    } else if (p.type === 5) {
      $('c5_ax').value = p.vertices[0].x; $('c5_ay').value = p.vertices[0].y;
      $('c5_bx').value = p.vertices[1].x; $('c5_by').value = p.vertices[1].y;
      $('c5_cx').value = p.vertices[2].x; $('c5_cy').value = p.vertices[2].y;
      $('c5_pe').value = p.pointP.startIdx; $('c5_pe2').value = p.pointP.endIdx;
      $('c5_qe').value = p.pointQ.startIdx; $('c5_qe2').value = p.pointQ.endIdx;
      $('c5_vp').value = p.pointP.speed; $('c5_vq').value = p.pointQ.speed;
    } else if (p.type === 6) {
      $('c6_fw').value = p.fixed.w;
      $('c6_fh').value = p.fixed.h;
      $('c6_ms').value = p.moving.size;
      $('c6_speed').value = p.moving.speed;
    } else if (p.type === 7) {
      const rect = (p.shapes||[]).find(s => s.type === 'rect') || { w: 4, h: 3 };
      $('c7_b').value = rect.w; $('c7_a').value = rect.h;
      const segs = p.pathSegs || [{ tEnd: 5 }, { tEnd: 8 }];
      $('c7_t1').value = segs[0]?.tEnd || 5; $('c7_t2').value = segs[1]?.tEnd || 8;
      $('c7_expr').value = p.trackedExpr || 'py-px';
      $('c7_name').value = p.trackedName || 'PQ-DQ';
      $('c7_x0').value = p.xRange ? p.xRange[0] : -1;
      $('c7_x1').value = p.xRange ? p.xRange[1] : 8;
      $('c7_y0').value = p.yRange ? p.yRange[0] : -3;
      $('c7_y1').value = p.yRange ? p.yRange[1] : 6;
    }
  }

  _readManualConfig() {
    const type = parseInt($('cfgType').value);
    let problem = null;

    switch (type) {
      case 1: {
        const dist = parseFloat($('c1_dist').value) || 300;
        problem = {
          type: 1, title: '追及相遇问题', confidence: 'manual',
          distance: dist, unitDist: 'km', unitTime: 'h',
          objects: [
            { name: '甲', speed: parseFloat($('c1_v1').value)||60, startPos: 0, direction: parseInt($('c1_dir1').value), delay: parseFloat($('c1_delay1').value)||0, color: '#b5583d' },
            { name: '乙', speed: parseFloat($('c1_v2').value)||90, startPos: dist, direction: parseInt($('c1_dir2').value), delay: parseFloat($('c1_delay2').value)||0, color: '#3a7d5e' }
          ]
        };
        break;
      }
      case 2: {
        const rawCurves = $('c2_curves').value.trim().split('\n').filter(l => l.trim());
        const curves = rawCurves.map((expr, i) => ({
          expr: expr.trim(), label: `f${String.fromCharCode(8320 + i)}`,
          color: CURVE_COLORS[i % CURVE_COLORS.length]
        }));
        const paramName = $('c2_pn').value.trim() || 'm';
        const dynExpr = $('c2_de').value.trim() || (paramName + '*x');
        const condVal = parseFloat($('c2_cval').value)||1;
        const condOp = $('c2_op').value;
        const relType = $('c2_rel').value;
        // Recompute param range
        const testVals = [];
        for (let i=1;i<=60;i++) testVals.push(condVal+i*0.02);
        testVals.push(condVal+2,condVal+5,condVal+10,condVal+50);
        const lowerBs=[], upperBs=[];
        testVals.forEach(x => {
          let valid = (condOp==='>'||condOp==='>=')?x>condVal:x<condVal;
          if (!valid||x===0) return;
          const ys = curves.map(c=>evalExpr(c.expr,{x})).filter(y=>isFinite(y));
          if (!ys.length) return;
          const lo=Math.min(...ys), hi=Math.max(...ys);
          if (relType==='above') lowerBs.push(hi/x);
          else if (relType==='below') upperBs.push(lo/x);
          else { lowerBs.push(lo/x); upperBs.push(hi/x); }
        });
        const pMin = lowerBs.length>0?Math.max(...lowerBs):-20;
        const pMax = upperBs.length>0?Math.min(...upperBs):20;
        const xMin=Math.min(0,condVal)-2, xMax=Math.max(condVal+4,6);
        problem = {
          type:2, title:'函数动态问题', confidence:'manual', curves, dynExpr, paramName, relType,
          condition:{var:'x',op:condOp,value:condVal},
          paramRange:{min:pMin,max:pMax}, xRange:[xMin,xMax], yRange:[-12,18]
        };
        break;
      }
      case 3: {
        const lines = $('c3_segs').value.trim().split('\n').filter(l => l.trim());
        const segments = lines.map(line => {
          const [dur, v0, a, label] = line.split(',').map(s => s.trim());
          return { duration: parseFloat(dur)||2, v0: parseFloat(v0)||0, a: parseFloat(a)||0, label: label || '运动' };
        });
        const totalTime = segments.reduce((s, seg) => s + seg.duration, 0);
        let totalDist = 0;
        segments.forEach(seg => { totalDist += seg.v0 * seg.duration + 0.5 * seg.a * seg.duration * seg.duration; });
        problem = { type: 3, title: '物理分段运动', confidence: 'manual', segments, totalTime, totalDistance: Math.max(totalDist,1), unitDist: 'm', unitTime: 's' };
        break;
      }
      case 4: {
        problem = {
          type: 4, title: '坐标系动点与面积', confidence: 'manual',
          pathType: $('c4_path').value, speed: parseFloat($('c4_speed').value)||1,
          curveFunc: $('c4_func').value || 'x*x', tMax: parseFloat($('c4_tmax').value)||5,
          unitDist: '', unitTime: 's'
        };
        break;
      }
      case 5: {
        const verts = [
          { x: parseFloat($('c5_ax').value)||0, y: parseFloat($('c5_ay').value)||0, l: 'A' },
          { x: parseFloat($('c5_bx').value)||8, y: parseFloat($('c5_by').value)||0, l: 'B' },
          { x: parseFloat($('c5_cx').value)||8, y: parseFloat($('c5_cy').value)||6, l: 'C' }
        ];
        problem = {
          type: 5, title: '双动点与几何关系', confidence: 'manual', vertices: verts,
          pointP: { startIdx: parseInt($('c5_pe').value), endIdx: parseInt($('c5_pe2').value), speed: parseFloat($('c5_vp').value)||1, color: '#b5583d', name: 'P' },
          pointQ: { startIdx: parseInt($('c5_qe').value), endIdx: parseInt($('c5_qe2').value), speed: parseFloat($('c5_vq').value)||2, color: '#3a7d5e', name: 'Q' },
          unitDist: 'cm', unitTime: 's'
        };
        break;
      }
      case 6: {
        const fw = parseFloat($('c6_fw').value)||6, fh = parseFloat($('c6_fh').value)||6;
        const ms = parseFloat($('c6_ms').value)||4, sp = parseFloat($('c6_speed').value)||2;
        problem = {
          type: 6, title: '图形平移与重叠面积', confidence: 'manual',
          fixed: { type: $('c6_fixed').value, w: fw, h: fh, color: '#667788' },
          moving: { type: $('c6_mov').value, size: ms, speed: sp, startX: -ms - 1, color: '#b5583d' },
          totalTime: (fw + ms) / sp + 1, unitDist: 'cm', unitTime: 's'
        };
        break;
      }
      case 7: {
        const b = parseFloat($('c7_b').value)||4, a = parseFloat($('c7_a').value)||3;
        const t1 = parseFloat($('c7_t1').value)||5, t2 = parseFloat($('c7_t2').value)||8;
        const x0 = parseFloat($('c7_x0').value)||-1, x1 = parseFloat($('c7_x1').value)||8;
        const y0 = parseFloat($('c7_y0').value)||-3, y1 = parseFloat($('c7_y1').value)||6;
        problem = {
          type: 7, title: '自定义动态问题', confidence: 'manual',
          xRange: [x0, x1], yRange: [y0, y1], tMax: t2, paramName: 't',
          shapes: [{ type: 'rect', x: 0, y: 0, w: b, h: a, color: '#5b8def', label: 'ABCD' }],
          fixPoints: [
            { x: 0, y: 0, color: '#5bb98c', label: 'D' },
            { x: b, y: 0, color: '#5bb98c', label: 'C' },
            { x: b, y: a, color: '#5bb98c', label: 'B' },
            { x: 0, y: a, color: '#5bb98c', label: 'A' }
          ],
          pathSegs: [{ tEnd: t1, desc: 'D→B' }, { tEnd: t2, desc: 'B→C' }],
          trackedExpr: $('c7_expr').value || 'py-px',
          trackedName: $('c7_name').value || 'PQ-DQ',
          unitDist: '', unitTime: 's'
        };
        break;
      }
    }
    return problem;
  }
}

  window._app = app;
  app.init();

  // Re-setup canvas after fonts/content loaded
  setupHiDPI();

  // Load first example by default
  $('problemInput').value = EXAMPLES[1];
  app.loadProblem(EXAMPLES[1], true);
});
</script>
